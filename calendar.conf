# A wall calendar in large type: a month or a whole year.
# Installed as /usr/local/share/b8k/apps.d/calendar.conf; b8k-apps adds it to
# the shell's programs (fields: see /usr/local/share/b8k/apps.conf).
[calendar]
label = Календарь
icon = /usr/local/share/b8k/calendar.svg
app_ids = b8k.Calendar b8k-calendar
exec = b8k-calendar
